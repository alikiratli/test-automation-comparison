# ---------------------------------------------------------------------------
# Tam paket - uc yiginin TUM testleri.
#
# Neden ayri bir workflow?
#   Uc paketin toplami ~16 dakikadir (Selenium 6dk07, Robot ~9dk, Playwright
#   1dk37) ve hepsi canli saucedemo.com'a baglanir. Bu maliyet her push icin
#   degil, gunde bir kez ve istendiginde elle kosturmak icin uygundur.
#
#   Ayrica bu workflow, README'deki karsilastirma tablosunun sayilarini
#   tazeleyen yerdir: her kosumda ozet tabloya uc yiginin gercek suresi yazilir.
# ---------------------------------------------------------------------------
name: Tam paket

on:
  schedule:
    # Her gun 03:00 UTC (Turkiye saatiyle 06:00)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      stack:
        description: "Hangi yigin kossun?"
        required: true
        default: all
        type: choice
        options:
          - all
          - selenium
          - robot
          - playwright

concurrency:
  group: full-suite
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  full:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Selenium + pytest
            slug: selenium
            dir: 01-selenium-pytest
            reports: 01-selenium-pytest/reports

          - name: Robot Framework
            slug: robot
            dir: 02-robot-framework
            reports: 02-robot-framework/results

          - name: Playwright + pytest
            slug: playwright
            dir: 03-playwright-pytest
            reports: 03-playwright-pytest/reports

    steps:
      # Elle tetiklenip tek bir yigin secildiyse digerlerini atla.
      - name: Bu yigin kosacak mi?
        id: gate
        run: |
          secim="${{ github.event.inputs.stack || 'all' }}"
          if [ "$secim" = "all" ] || [ "$secim" = "${{ matrix.slug }}" ]; then
            echo "kos=true" >> "$GITHUB_OUTPUT"
          else
            echo "kos=false" >> "$GITHUB_OUTPUT"
            echo "Atlandi: secim=$secim, bu is=${{ matrix.slug }}"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.kos == 'true'

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.kos == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.dir }}/requirements.txt

      - name: Bagimliliklari kur
        if: steps.gate.outputs.kos == 'true'
        run: pip install -r ${{ matrix.dir }}/requirements.txt

      - name: Playwright tarayicilarini kur
        if: steps.gate.outputs.kos == 'true' && matrix.slug == 'playwright'
        working-directory: ${{ matrix.dir }}
        run: python -m playwright install --with-deps chromium

      - name: Chrome surumunu yaz
        if: steps.gate.outputs.kos == 'true' && matrix.slug != 'playwright'
        run: google-chrome --version

      - name: Baslangic zamani
        if: steps.gate.outputs.kos == 'true'
        id: baslangic
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Tum paket (Selenium)
        if: steps.gate.outputs.kos == 'true' && matrix.slug == 'selenium'
        working-directory: ${{ matrix.dir }}
        run: python -m pytest --reruns 1 --reruns-delay 3 -p no:cacheprovider

      - name: Tum paket (Robot)
        if: steps.gate.outputs.kos == 'true' && matrix.slug == 'robot'
        working-directory: ${{ matrix.dir }}
        # Robot'un pytest'teki `--reruns` gibi bir secenegi YOKTUR; ayni
        # toleransi `--rerunfailed` + `rebot --merge` ikilisi saglar: dusen
        # testler 1 KEZ daha denenir ve sonuclar TEK rapora birlestirilir.
        # Sayi, ayni iste kosan pytest'in `--reruns 1` degeriyle ayni tutuldu.
        # Ayrintili gerekce icin bkz. ci.yml.
        run: |
          set +e
          python -m robot \
            --outputdir results \
            --output output.xml \
            --variablefile variables/environment.py:prod:chrome:true \
            tests/
          durum=$?
          deneme=0
          while [ $durum -ne 0 ] && [ $deneme -lt 1 ]; do
            deneme=$((deneme + 1))
            echo "::warning::Robot: dusen testler icin tekrar denemesi $deneme"
            python -m robot \
              --rerunfailed results/output.xml \
              --outputdir results \
              --output rerun.xml \
              --variablefile variables/environment.py:prod:chrome:true \
              tests/
            python -m robot.rebot \
              --outputdir results \
              --output output.xml \
              --merge results/output.xml results/rerun.xml
            durum=$?
          done
          exit $durum

      - name: Tum paket (Playwright)
        if: steps.gate.outputs.kos == 'true' && matrix.slug == 'playwright'
        working-directory: ${{ matrix.dir }}
        # "not visual" gerekcesi ci.yml'deki ile ayni: referans goruntuler
        # Windows'ta uretildi, Linux'ta yazi tipi render'i farkli.
        run: |
          python -m pytest -m "not visual" \
            --reruns 1 --reruns-delay 3 \
            -p no:cacheprovider

      - name: Sureyi is ozetine yaz
        if: always() && steps.gate.outputs.kos == 'true'
        run: |
          bitis=$(date +%s)
          sure=$(( bitis - ${{ steps.baslangic.outputs.ts }} ))
          dk=$(( sure / 60 )); sn=$(( sure % 60 ))
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "| Olcum | Deger |"
            echo "|-------|-------|"
            echo "| Sure | ${dk} dk ${sn} sn (${sure} sn) |"
            echo "| Sonuc | ${{ job.status }} |"
            echo "| Calisan | \`ubuntu-latest\` / GitHub-hosted |"
            echo ""
            echo "> Not: GitHub runner'lari README'deki olcumlerin alindigi"
            echo "> makineden yavastir; buradaki sureler mutlak deger olarak"
            echo "> degil, uc yigin ARASINDAKI oran icin anlamlidir."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Raporlari artifact olarak yukle
        if: always() && steps.gate.outputs.kos == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: full-report-${{ matrix.slug }}
          path: ${{ matrix.reports }}
          retention-days: 14
          if-no-files-found: ignore
