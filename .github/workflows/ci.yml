# ---------------------------------------------------------------------------
# CI - her push ve pull request'te kosar.
#
# TASARIM KARARI:
#   Bu depodaki testler CANLI bir ucuncu taraf siteye (saucedemo.com) baglanir
#   ve tam paket ucu birden ~16 dakika surer. Her push'ta hepsini kosturmak
#   hem yavastir hem de bizim kontrolumuzde olmayan bir servise gereksiz yuk
#   bindirir. Bu yuzden is ikiye bolundu:
#
#     ci.yml (bu dosya)  -> hizli: statik kontroller + sadece smoke testleri
#     full-suite.yml     -> gecelik / manuel: uc paketin tamami + artifact'lar
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Ayni dal icin yeni push gelirse eski kosumu iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # -------------------------------------------------------------------------
  # 1) Tarayici gerektirmeyen kontroller. Saniyeler icinde biter ve
  #    sozdizimi/veri hatalarini smoke testleri baslamadan yakalar.
  # -------------------------------------------------------------------------
  static-checks:
    name: Statik kontroller
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Bagimliliklari kur (Robot dry-run icin yeterli)
        run: pip install -r 02-robot-framework/requirements.txt

      - name: Python sozdizimi derlemesi (uc proje + docs)
        run: |
          python -m compileall -q \
            01-selenium-pytest 02-robot-framework 03-playwright-pytest docs

      - name: Ortak test verisi gecerli JSON mu?
        run: |
          python - <<'PY'
          import json, pathlib, sys

          for path in sorted(pathlib.Path("shared").glob("*.json")):
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  sys.exit(f"GECERSIZ JSON: {path} -> {exc}")
              print(f"OK  {path}")
          PY

      - name: Robot suite'lerini dry-run et
        working-directory: 02-robot-framework
        # --dryrun tarayici acmadan tum keyword cagrilarini cozumler:
        # yazim hatasi, eksik keyword, yanlis argüman sayisi burada yakalanir.
        #
        # DataDriver suite'i BILEREK haric tutulmuyor: dry-run sirasinda
        # DataDriver CSV'yi okuyup testleri uretir; boylece lehce/ayrac ve
        # sutun-arguman eslesmesi hatalari da tarayici acilmadan yakalanir.
        # (Bu iki hata daha once gecelik kosumu kiriyordu.)
        run: |
          python -m robot --dryrun \
            --outputdir results/dryrun \
            --variablefile variables/environment.py:prod:chrome:true \
            tests/

      - name: pytest toplama kontrolu (test kosmadan)
        # --collect-only import hatalarini ve bozuk marker'lari yakalar.
        run: |
          pip install -r 01-selenium-pytest/requirements.txt
          (cd 01-selenium-pytest && python -m pytest --collect-only -q --no-header -p no:cacheprovider)

  # -------------------------------------------------------------------------
  # 2) Uc yigin icin smoke testleri - paralel, birbirinden bagimsiz.
  #    fail-fast: false, cunku amac "hangi yigin bozuldu" sorusunu ayni
  #    kosumda cevaplayabilmek.
  # -------------------------------------------------------------------------
  smoke:
    name: Smoke - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Selenium + pytest
            slug: selenium
            dir: 01-selenium-pytest
            reports: 01-selenium-pytest/reports

          - name: Robot Framework
            slug: robot
            dir: 02-robot-framework
            reports: 02-robot-framework/results

          - name: Playwright + pytest
            slug: playwright
            dir: 03-playwright-pytest
            reports: 03-playwright-pytest/reports

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.dir }}/requirements.txt

      - name: Bagimliliklari kur
        run: pip install -r ${{ matrix.dir }}/requirements.txt

      # Playwright tarayici binary'lerini kendisi indirir; Selenium ve Robot
      # ise runner imajinda hazir gelen Chrome'u kullanir (chromedriver'i
      # Selenium Manager otomatik cozer). Ikisi arasindaki kurulum farki
      # bu iki adimda birebir gorunur.
      - name: Playwright tarayicilarini kur
        if: matrix.slug == 'playwright'
        working-directory: ${{ matrix.dir }}
        run: python -m playwright install --with-deps chromium

      - name: Chrome surumunu yaz
        if: matrix.slug != 'playwright'
        run: google-chrome --version

      - name: Smoke testleri (Selenium)
        if: matrix.slug == 'selenium'
        working-directory: ${{ matrix.dir }}
        # --reruns: testler canli bir siteye baglandigi icin ag kaynakli tek
        # seferlik hatalari build'i kirmadan tolere ediyoruz. Gercek bir
        # regresyon iki denemede de duser.
        run: |
          python -m pytest -m smoke \
            --reruns 2 --reruns-delay 3 \
            -p no:cacheprovider

      - name: Smoke testleri (Robot)
        if: matrix.slug == 'robot'
        working-directory: ${{ matrix.dir }}
        # Robot'un pytest'teki `--reruns` gibi bir secenegi YOKTUR; ayni
        # toleransi `--rerunfailed` + `rebot --merge` ikilisi saglar: dusen
        # testler EN FAZLA 2 KEZ daha denenir ve sonuclar TEK rapora
        # birlestirilir. Sayi, ayni iste kosan pytest'in `--reruns 2` degeriyle
        # bilerek ayni tutuldu.
        #
        # Gerekcesi de ayni: testler bizim kontrolumuzde olmayan canli bir
        # siteye baglanir. Ozellikle `performance_glitch_user` senaryosu
        # olculdugunde 3 kosumdan 1'inde aga/gecikmeye bagli olarak dusuyor.
        # Gercek bir regresyon her denemede duser, dolayisiyla maskelenmez.
        run: |
          set +e
          python -m robot \
            --include smoke \
            --outputdir results \
            --output output.xml \
            --variablefile variables/environment.py:prod:chrome:true \
            tests/
          durum=$?
          deneme=0
          while [ $durum -ne 0 ] && [ $deneme -lt 2 ]; do
            deneme=$((deneme + 1))
            echo "::warning::Robot: dusen testler icin tekrar denemesi $deneme"
            python -m robot \
              --rerunfailed results/output.xml \
              --outputdir results \
              --output rerun.xml \
              --variablefile variables/environment.py:prod:chrome:true \
              tests/
            python -m robot.rebot \
              --outputdir results \
              --output output.xml \
              --merge results/output.xml results/rerun.xml
            durum=$?
          done
          exit $durum

      - name: Smoke testleri (Playwright)
        if: matrix.slug == 'playwright'
        working-directory: ${{ matrix.dir }}
        # "not visual": gorsel regresyon referanslari Windows'ta uretildi.
        # Linux runner'da yazi tipi render'i farkli oldugu icin bu testler
        # platform farkindan duser - gercek bir regresyondan degil.
        run: |
          python -m pytest -m "smoke and not visual" \
            --reruns 2 --reruns-delay 3 \
            -p no:cacheprovider

      - name: Raporlari artifact olarak yukle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report-${{ matrix.slug }}
          path: ${{ matrix.reports }}
          retention-days: 7
          if-no-files-found: ignore
