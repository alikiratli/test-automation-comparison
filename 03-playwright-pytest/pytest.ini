[pytest]
# ---------------------------------------------------------------------------
# PLAYWRIGHT PROJESI - pytest yapilandirmasi
#
# KARSILASTIRMA NOTU:
#   --browser, --headed, --tracing, --video, --screenshot, --slowmo
#   parametrelerini BIZ TANIMLAMIYORUZ; pytest-playwright eklentisi hazir
#   sunar. Selenium projesinde bunlarin hepsi conftest.py icinde elle
#   yazilmisti (pytest_addoption). Bu, "batarya dahil" felsefesinin farkidir.
# ---------------------------------------------------------------------------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --browser=chromium
    --tracing=retain-on-failure
    --video=retain-on-failure
    --screenshot=only-on-failure
    --output=reports/artifacts
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: Kritik yol testleri
    regression: Genis regresyon paketi
    login: Kimlik dogrulama
    inventory: Urun listesi
    cart: Sepet
    checkout: Odeme akisi
    e2e: Uctan uca akis
    negative: Negatif senaryolar
    slow: Yavas testler
    network: Ag katmani mudahalesi (Selenium/Robot'ta KARSILIGI YOK)
    visual: Gorsel regresyon (Selenium/Robot'ta KARSILIGI YOK)
    api: API testleri (Selenium/Robot'ta ayri kutuphane gerektirir)
    accessibility: Erisilebilirlik kontrolleri

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
