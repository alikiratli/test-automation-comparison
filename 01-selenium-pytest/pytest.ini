[pytest]
# ---------------------------------------------------------------------------
# SELENIUM PROJESI - pytest yapilandirmasi
#
# KARSILASTIRMA NOTU:
#   Selenium'da "test kosucu" framework'un parcasi degildir. Selenium sadece
#   tarayiciyi surer; testi kim kosacak, rapor kim uretecek, paralellik nasil
#   olacak -> hepsini siz secersiniz (burada pytest). Bu esneklik ayni zamanda
#   bir maliyettir: Robot Framework'te hazir gelen sey burada kurulmalidir.
# ---------------------------------------------------------------------------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    # GERCEK BIR SORUNUN COZUMU:
    #   Uc proje ayni sanal ortama kurulursa, pytest-playwright eklentisi HER
    #   pytest kosumunda otomatik yuklenir ve kendi --browser secenegini
    #   kaydeder. Bu, asagidaki conftest.py'nin --browser secenegiyle catisir:
    #       argparse.ArgumentError: conflicting option string: --browser
    #   Eklentiyi bu proje icin devre disi birakiyoruz. (Playwright kurulu
    #   degilse bu satir zararsizdir.)
    #   En temiz cozum yine de her proje icin AYRI sanal ortam kullanmaktir.
    -p no:playwright
    --tb=short
    --timeout=120
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: Her deploy sonrasi kosan kritik yol testleri
    regression: Genis kapsamli regresyon paketi
    login: Kimlik dogrulama testleri
    inventory: Urun listesi testleri
    cart: Sepet testleri
    checkout: Odeme akisi testleri
    e2e: Uctan uca is akisi
    negative: Negatif / hata senaryolari
    slow: Yavas calisan testler (performance_glitch_user gibi)

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
